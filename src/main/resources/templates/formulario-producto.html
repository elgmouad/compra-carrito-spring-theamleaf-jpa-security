<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario Producto</title>
</head>

<body>

<h1>Formulario de producto</h1>

<form th:action="@{/products}"
      th:object="${product}"
      method="post">

    <input type="hidden"
           th:field="*{id}">

    <div>

        <label for="name">
            Nombre:
        </label>

        <input type="text"
               id="name"
               th:field="*{name}"
               required>

    </div>

    <br>

    <div>

        <label for="price">
            Precio:
        </label>

        <input type="number"
               id="price"
               th:field="*{price}"
               step="0.01"
               min="0"
               required>

    </div>

    <br>

    <button type="submit">
        Guardar
    </button>

</form>

<br>

<a href="/products">
    Volver a productos
</a>

</body>
</html>
